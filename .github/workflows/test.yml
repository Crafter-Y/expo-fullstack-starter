name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]

jobs:
  playwright:
    name: "Vitest"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    steps:
      - uses: actions/checkout@v5

      - name: Install missing linux dependencies
        run: apt-get update && apt-get install -y unzip jq rsync

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install

      - name: Run testsuite
        run: bun run test:coverage

      - name: Report coverage
        if: always() && github.event_name == 'pull_request' && github.base_ref == 'master'
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Deploy codecoverage html
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./coverage/
          umbrella-dir: coverage

      - name: Build static storybook
        run: bun run build-storybook

      - name: Deploy storybook preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./storybook-static/
          umbrella-dir: storybook
