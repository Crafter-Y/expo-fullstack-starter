name: Test

on:
  push:
    branches: [master]
  pull_request:
    branches: ["**"]
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency: preview-${{ github.ref }}

jobs:
  playwright:
    name: "Vitest"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
    steps:
      - uses: actions/checkout@v5

      - name: Install missing linux dependencies
        run: apt-get update && apt-get install -y unzip jq rsync

      - name: Setup Bun
        if: github.event.action != 'closed'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        if: github.event.action != 'closed'
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: bun install

      - name: Run testsuite
        if: github.event.action != 'closed'
        run: bun run test:coverage

      - name: Report coverage
        if: always() && github.event_name == 'pull_request' && github.base_ref == 'master' && github.event.action != 'closed'
        uses: davelosert/vitest-coverage-report-action@v2

      - name: Deploy codecoverage html
        id: preview-coverage
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./coverage/
          umbrella-dir: coverage
          comment: false

      - name: Build static storybook
        if: github.event.action != 'closed'
        run: bun run build-storybook

      - name: Deploy storybook preview
        id: preview-storybook
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./storybook-static/
          umbrella-dir: storybook
          comment: false

      - name: Update sticky comment (deploy)
        uses: marocchino/sticky-pull-request-comment@v2
        if: steps.preview-storybook.outputs.deployment-action == 'deploy' && env.deployment_status == 'success'
        with:
          header: pr-preview
          message: |
            [PR Preview Action](https://github.com/rossjrw/pr-preview-action) ${{ steps.preview-storybook.outputs.action-version }}
            :---:
            | <p></p> :rocket: View preview at <br> ${{ steps.preview-storybook.outputs.preview-url }} <br> ${{ steps.preview-coverage.outputs.preview-url }} <br><br>
            | <h6>Built to branch [`gh-pages`](${{ github.server_url }}/${{ github.repository }}/tree/gh-pages) at ${{ steps.preview-storybook.outputs.action-start-time }}. <br> Preview will be ready when the [GitHub Pages deployment](${{ github.server_url }}/${{ github.repository }}/deployments) is complete. <br><br> </h6>

      - name: Update sticky comment (close)
        uses: marocchino/sticky-pull-request-comment@v2
        if: steps.preview-storybook.outputs.deployment-action == 'remove' && env.deployment_status == 'success'
        with:
          header: pr-preview
          message: |
            [PR Preview Action](https://github.com/rossjrw/pr-preview-action) ${{ steps.preview-storybook.outputs.action-version }}
            :---:
            Preview removed because the pull request was closed.
            ${{ steps.preview-storybook.outputs.action-start-time }}
